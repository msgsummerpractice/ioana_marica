spring.application.name=demo
logging.level.root=INFO
logging.level.com.example.loggingdemo=DEBUG
user.controller.port=8081
user.controller.host-name=localhost
spring.profiles.active=dev
user.min-age=0
api.version=1.0
app.welcome.message=Welcome to the Spring Boot Application!


spring.datasource.url=jdbc:postgresql://localhost:5432/spring_data_jpa
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.mvc.contentnegotiation.favor-parameter=true
spring.mvc.contentnegotiation.parameter-name=format
spring.mvc.contentnegotiation.media-types.json=application/json
spring.mvc.contentnegotiation.media-types.xml=application/xml