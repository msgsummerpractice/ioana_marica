<mat-toolbar-row>
  <div class="flex justify-end items-center">
    <button matButton="filled">
      <a href="#" class="text-black font-semibold hover:text-gray-300">
        <mat-icon>info</mat-icon>
      </a>
    </button>

    <button matButton="filled">
      <a href="#" class="text-black font-semibold hover:text-gray-300">
        <mat-icon>settings</mat-icon>
      </a>
    </button>

    <button matButton="filled" s>
      <a href="#" class="text-black font-semibold hover:text-gray-300">
        <mat-icon>home</mat-icon>
      </a>
    </button>

    <button matButton="filled" (click)="login()">
      <mat-icon>login</mat-icon>
      Login
    </button>
    <button matButton="filled" (click)="logout()"><mat-icon>logout</mat-icon>Logout</button>
  </div>
</mat-toolbar-row>

<header class="text-black p-4">
  <h1 class="text-4xl font-semibold p-4 flex justify-center items-center">Dog Gallery</h1>

  <p class="mt-2 text-lg text-black font-semibold flex justify-center items-center">
    Here are some cute dogs. Admire them.
  </p>
</header>

<div *ngIf="dogs().length" class="grid grid-cols-3">
  <div class="bg-gray-200 rounded-xl text-center">
    <img [src]="dogs()[0]" alt="First dog" class="w-200 h-100 object-cover rounded-lg" />
    <h3 class="text-xl font-semibold mb-2">Here is the first cute dog.</h3>
  </div>

  <div class="bg-gray-200 rounded-xl text-center">
    <img [src]="dogs()[1]" alt="Second dog" class="w-200 h-100 object-cover rounded-lg" />
    <h3 class="text-xl font-semibold mb-2">Here is the second cute dog.</h3>
  </div>

  <div class="bg-gray-200 rounded-xl text-center">
    <img [src]="dogs()[2]" alt="Third dog" class="w-200 h-100 object-cover rounded-lg" />
    <h3 class="text-xl font-semibold mb-2">Here is the third cute dog.</h3>
  </div>

  <div *appAuth class="text-l font-semibold mb-2">
    <p>You are authenticated.</p>
  </div>
</div>
